name: Scores en direct
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    paths: [".github/workflows/scores.yml", "tools/scores.py"]
permissions:
  contents: write
concurrency:
  group: scores
  cancel-in-progress: false
jobs:
  scores:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Mettre à jour les scores toutes les 2 minutes pendant 25 minutes
        run: |
          git config user.name "andyrichard76-rgb"
          git config user.email "andyrichard76-rgb@users.noreply.github.com"
          for i in $(seq 1 13); do
            git pull -q --rebase origin main || true
            python3 tools/scores.py || true
            git add data.json
            if ! git diff --cached --quiet; then
              git commit -q -m "Mise à jour des scores"
              for k in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done
            fi
            [ "$i" -lt 13 ] && sleep 120
          done
