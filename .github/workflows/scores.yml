name: Scores en direct
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    paths: [".github/workflows/scores.yml", "tools/scores.py"]
permissions:
  contents: write
concurrency:
  group: scores
  cancel-in-progress: false
jobs:
  scores:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Mettre à jour les scores
        run: python3 tools/scores.py
      - name: Enregistrer
        run: |
          git config user.name "andyrichard76-rgb"
          git config user.email "andyrichard76-rgb@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Mise à jour des scores"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && break; sleep 5; done
